name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: bash deploy/cloud-init_test.sh
      - run: docker build -t termfolio:ci .

  # Decides whether this push changes the image. Docs, the license and the
  # first-boot scripts are not in it, so pushes touching only those skip the
  # deploy. Deploys anyway when the previous commit is unknown (force push).
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          image=true
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null &&
            git diff --quiet "$BEFORE" HEAD -- \
              go.mod go.sum cmd internal content Dockerfile .dockerignore; then
            image=false
          fi
          echo "image=$image" | tee -a "$GITHUB_OUTPUT"

  deploy:
    needs: [test, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t "termfolio:${GITHUB_SHA}" .
      - name: Ship the image to Lightsail
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          docker save "termfolio:${GITHUB_SHA}" | gzip \
            | ssh -i ~/.ssh/deploy -p 2200 "deploy@${DEPLOY_HOST}" "${GITHUB_SHA}"
      - name: Smoke test
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          sleep 3
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "guest@${DEPLOY_HOST}" whoami | grep -q '^guest'
